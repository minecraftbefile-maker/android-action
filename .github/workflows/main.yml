name: Android 11 Emulator (Full UI, 6h max)

on:
  workflow_dispatch:

jobs:
  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || { echo "❌ /dev/kvm missing"; exit 1; }

      - name: Install cloudflared & start tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

          setsid nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 < /dev/null &
          disown || true

          echo "Waiting for cloudflared to publish a URL..."
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done
          [ -z "$URL" ] && { echo "Failed to obtain tunnel URL"; cat /tmp/cloudflared.log; exit 1; }

          NOVNC_URL="$URL/vnc.html?autoconnect=true&resize=scale"
          echo "=========================================================="
          echo "✅ noVNC URL: $NOVNC_URL"
          echo "=========================================================="
          echo "NOVNC_URL=$NOVNC_URL" >> "$GITHUB_ENV"

      - name: Start Android 11 Emulator (lightweight Alpine image)
        run: |
          docker run -d --name android-emulator \
            --privileged \
            -p 6080:6080 -p 5554:5554 -p 5555:5555 \
            -e "EMULATOR_DEVICE=Samsung Galaxy S10" \
            -e "WEB_VNC=true" \
            -e "EMULATOR_DATA_PARTITION=4096m" \
            budtmo/docker-android:emulator_11.0

      - name: Wait for emulator to boot
        run: |
          echo "Waiting for noVNC to be reachable..."
          timeout 300 bash -c 'until curl -sf http://localhost:6080/vnc.html >/dev/null; do sleep 2; done' \
            || { echo "noVNC not reachable"; docker logs android-emulator --tail 100; exit 1; }

          echo "Waiting for Android UI to fully boot..."
          timeout 600 bash -c '
            until [ "$(docker exec android-emulator adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done
          ' || echo "⚠️  Boot check timed out; emulator may still be booting."

          echo "✅ Emulator is up."

      - name: Keep session alive (6h)
        run: |
          echo "Live URL: $NOVNC_URL"
          sleep 21600
