name: Android 13 Emulator (Full UI, 6h max)

on:
  workflow_dispatch:

jobs:
  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours – GitHub-hosted runner max

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android 13 Emulator with noVNC
        run: |
          docker run -d --name android-emulator \
            --privileged \
            -p 6080:6080 -p 5554:5554 -p 5555:5555 \
            -e "EMULATOR_DEVICE=Samsung Galaxy S10" \
            -e "WEB_VNC=true" \
            -e "EMULATOR_DATA_PARTITION=4096m" \
            budtmo/docker-android:emulator_13.0

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      # ---- FIXED: set NOVNC_URL as a shell variable so the check works ----
      - name: Start cloudflared quick tunnel
        run: |
          setsid nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 < /dev/null &
          disown || true

          echo "Waiting for cloudflared to publish a URL..."
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Failed to obtain tunnel URL"; cat /tmp/cloudflared.log; exit 1
          fi

          NOVNC_URL="$URL/vnc.html?autoconnect=true&resize=scale"
          echo "=========================================================="
          echo "✅ noVNC URL: $NOVNC_URL"
          echo "=========================================================="
          echo "NOVNC_URL=$NOVNC_URL" >> "$GITHUB_ENV"

      - name: Wait for emulator to boot
        run: |
          adb start-server
          adb connect localhost:5555 || true
          timeout 300 bash -c '
            until adb devices | grep -qE "(emulator-5554|localhost:5555)[[:space:]]+device$"; do sleep 5; done
          '
          timeout 180 bash -c '
            until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done
          '
          echo "Emulator UI is ready."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Install APK
        run: adb -s localhost:5555 install -r app/build/outputs/apk/debug/app-debug.apk

      - name: Keep session alive (6h)
        run: |
          echo "Live URL (also printed in the previous step's log): $NOVNC_URL"
          sleep 21600
